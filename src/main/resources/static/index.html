<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>事业编面试 AI 训练台</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="brand-block">
            <p class="eyebrow">AI INTERVIEW STUDIO</p>
            <h1>事业编结构化面试训练</h1>
            <p class="subtitle">面向事业编结构化面试，聚焦表达、结构、内容和临场节奏复盘。</p>
        </div>
        <div class="status-strip" aria-label="训练状态">
            <div>
                <span>题源</span>
                <strong>默认随机</strong>
            </div>
            <div>
                <span>计时</span>
                <strong>05:00</strong>
            </div>
            <div>
                <span>评分</span>
                <strong>DeepSeek</strong>
            </div>
        </div>
    </header>

    <main class="app-grid">
        <aside class="control-panel panel" aria-labelledby="settingsTitle">
            <div class="section-title">
                <span>01</span>
                <h2 id="settingsTitle">出题模式</h2>
            </div>

            <div class="mode-switch" role="group" aria-label="出题模式">
                <button id="randomModeBtn" class="mode-option active" type="button" aria-pressed="true">随机题库</button>
                <button id="customModeBtn" class="mode-option" type="button" aria-pressed="false">自定义题目</button>
            </div>

            <section id="randomModePanel" class="mode-panel" aria-label="随机题库">
                <div class="form-row">
                    <label for="typeSelect">考试类型</label>
                    <select id="typeSelect">
                        <option value="">全部类型</option>
                        <option value="NATIONAL">国考</option>
                        <option value="PROVINCIAL">省考</option>
                        <option value="INSTITUTION">事业编</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="yearSelect">年份</label>
                    <select id="yearSelect">
                        <option value="">全部年份</option>
                    </select>
                </div>

                <button id="randomBtn" class="primary" type="button">随机出题</button>
            </section>

            <section id="customModePanel" class="mode-panel hidden" aria-label="自定义题目">
                <div class="form-row">
                    <label for="customQuestionInput">题目内容</label>
                    <textarea id="customQuestionInput" class="custom-question-input" placeholder="请输入你的自定义面试题目"></textarea>
                </div>
                <button id="useCustomQuestionBtn" class="primary" type="button">使用自定义题目</button>
            </section>

            <p id="questionHint" class="mode-hint">默认从题库随机抽题。</p>

            <div class="timer-panel">
                <span class="timer-label">答题倒计时</span>
                <strong id="timerDisplay">05:00</strong>
                <div class="timer-track" aria-hidden="true"><span id="timerProgress"></span></div>
                <button id="startAnswerBtn" class="ghost" type="button" disabled>开始答题</button>
                <p id="timerStatus" class="microcopy">抽题后开始计时。</p>
            </div>
        </aside>

        <section class="workspace">
            <article class="question-card panel">
                <div class="section-title">
                    <span>02</span>
                    <h2>当前题目</h2>
                </div>
                <div id="questionMeta" class="meta">尚未出题</div>
                <div id="questionContent" class="question-empty">请选择随机题库或自定义题目。</div>
            </article>

            <article class="answer-card panel">
                <div class="section-title row-between">
                    <div class="title-inline">
                        <span>03</span>
                        <h2>现场作答</h2>
                    </div>
                    <div class="answer-stats">
                        <span id="wordCount">0 字</span>
                        <span id="durationDisplay">用时 00:00</span>
                    </div>
                </div>

                <div class="toolbar">
                    <button id="startVoiceBtn" type="button">开始语音</button>
                    <button id="stopVoiceBtn" type="button" disabled>停止</button>
                    <span id="voiceStatus" class="microcopy">可直接输入文字。</span>
                </div>

                <textarea id="answerInput" placeholder="开始答题后，在这里输入你的回答"></textarea>

                <div class="answer-footer">
                    <span class="microcopy">至少 20 字后可提交评分。</span>
                    <button id="evaluateBtn" class="primary compact" type="button" disabled>提交评分</button>
                </div>
            </article>

            <article class="result-card panel">
                <div class="section-title">
                    <span>04</span>
                    <h2>评分报告</h2>
                </div>
                <div id="loading" class="loading hidden">正在调用 DeepSeek 评分，请稍候...</div>
                <div id="result" class="result-empty">评分结果会显示在这里。</div>
            </article>
        </section>
    </main>
</div>
<script src="/app.js"></script>
</body>
</html>
